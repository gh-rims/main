<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم بصلاحيات المشتركين - وسائط الغامدي</title>
  <!-- خط Cairo من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- ملف التنسيقات الخارجية -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========================================== -->
  <!-- 1. الهيدر الموحد (Header)                   -->
  <!-- ========================================== -->
  <header class="main-header">
    <div class="header-right">
      <img src="Ligo.jpg" alt="شعار الغامدي" class="brand-logo">
      <span class="brand-name">الغامدي لإصلاح الجنوط</span>
    </div>

    <div class="header-center">
      <h1 class="page-title">لوحة التحكم بصلاحيات المشتركين</h1>
    </div>

    <div class="header-left">
      <a href="index.html" class="btn btn-secondary nav-back-btn">العودة إلى الصفحة الرئيسية</a>
    </div>
  </header>

  <main class="main-container">

    <!-- ========================================== -->
    <!-- 2. القسم الأول: إضافة مشترك جديد           -->
    <!-- ========================================== -->
    <section class="card-box">
      <h2 class="section-divider-title"><span>إضافة مشترك جديد</span></h2>
      
      <form id="addUserForm" class="add-user-form">
        <div class="form-row">
          <div class="form-group">
            <label for="newUsername">اسم المشترك بالإنجليزي (Username):</label>
            <input type="text" id="newUsername" class="form-control" placeholder="مثال: Ahmed" required>
          </div>
          <div class="form-group">
            <label for="newDisplayName">اسم المشترك الظاهر (DisplayName):</label>
            <input type="text" id="newDisplayName" class="form-control" placeholder="مثال: أحمد الغامدي" required>
          </div>
        </div>

        <div class="form-row align-items-end">
          <div class="form-group">
            <label for="newPassword">كلمة المرور (Password):</label>
            <input type="text" id="newPassword" class="form-control" placeholder="أدخل كلمة المرور" required>
          </div>
          <div class="form-group">
            <button type="submit" id="saveUserBtn" class="btn btn-orange btn-block">إضافة مشترك - حفظ</button>
          </div>
        </div>

        <div id="addUserMessage" class="status-msg hidden"></div>
      </form>
    </section>

    <!-- ========================================== -->
    <!-- 3. القسم الثاني والثالث: إدارة صلاحيات وأذونات المشتركين -->
    <!-- ========================================== -->
    <section class="card-box">
      <h2 class="section-divider-title"><span>إدارة أذونات وصلاحيات المشتركين</span></h2>
      
      <div id="usersListContainer" class="users-accordion-container">
        <div class="loading-spinner-text">جاري تحميل قائمة المشتركين...</div>
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- 4. التذييل (Footer)                        -->
  <!-- ========================================== -->
  <footer class="main-footer">
    <p>الغامدي لإصلاح الجنوط / 2026</p>
  </footer>

  <!-- ملف المنطق والرابط الأمامي -->
  <script src="app.js"></script>
</body>
</html>
